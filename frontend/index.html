<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TestMu AI - Voice QA Assistant</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161c2e;
      --accent-color: #0066ff;
      --accent-hover: #0052cc;
      --accent-glow: rgba(0, 102, 255, 0.4);
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --border-color: #242d42;
      --active-recording: #ff3366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header h1 span {
      color: var(--accent-color);
    }

    .badge {
      background: rgba(0, 102, 255, 0.15);
      color: var(--accent-color);
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
      border: 1px solid var(--accent-color);
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }

    .mic-button {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--accent-color);
      border: none;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      box-shadow: 0 0 20px var(--accent-glow);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      user-select: none;
      -webkit-user-select: none;
    }

    .mic-button:hover {
      background: var(--accent-hover);
      transform: scale(1.03);
    }

    .mic-button.recording {
      background: var(--active-recording);
      box-shadow: 0 0 30px rgba(255, 51, 102, 0.6);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    .status-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 12px;
      text-align: center;
    }

    .log-box {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      min-height: 160px;
      max-height: 300px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.9rem;
    }

    .message .sender {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .message.user .sender { color: var(--accent-color); }
    .message.bot .sender { color: #00d26a; }

    .message .text {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 12px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1><span>TestMu AI</span> Voice QA</h1>
      <span class="badge">LIVE QA AGENT</span>
    </div>

    <div class="controls">
      <button id="micBtn" class="mic-button">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
        <span>Hold to Talk</span>
      </button>
      <div id="statusText" class="status-text">Press and hold button to speak...</div>
    </div>

    <div class="log-box" id="logBox">
      <div class="message bot">
        <span class="sender">TestMu Assistant</span>
        <span class="text">Hello QA Engineer! Ask me to check test suite status or trigger a test run.</span>
      </div>
    </div>
  </div>

  <script>
    // Replace with your Render live backend URL after deployment
    const BACKEND_URL = "http://localhost:8000"; 

    const micBtn = document.getElementById("micBtn");
    const statusText = document.getElementById("statusText");
    const logBox = document.getElementById("logBox");

    let mediaRecorder;
    let audioChunks = [];

    // Initialize Microphone
    async function setupMicrophone() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) audioChunks.push(event.data);
        };

        mediaRecorder.onstop = sendAudioToBackend;
      } catch (err) {
        statusText.innerText = "Error: Microphone access denied.";
        console.error("Microphone Access Error:", err);
      }
    }

    setupMicrophone();

    // Start recording on Mouse Down / Touch Start
    function startRecording(e) {
      e.preventDefault();
      if (!mediaRecorder || mediaRecorder.state === "recording") return;
      audioChunks = [];
      mediaRecorder.start();
      micBtn.classList.add("recording");
      statusText.innerText = "Listening...";
    }

    // Stop recording on Mouse Up / Touch End
    function stopRecording(e) {
      e.preventDefault();
      if (!mediaRecorder || mediaRecorder.state !== "recording") return;
      mediaRecorder.stop();
      micBtn.classList.remove("recording");
      statusText.innerText = "Processing query...";
    }

    // Attach listeners for both desktop and mobile
    micBtn.addEventListener("mousedown", startRecording);
    micBtn.addEventListener("mouseup", stopRecording);
    micBtn.addEventListener("mouseleave", stopRecording);

    micBtn.addEventListener("touchstart", startRecording);
    micBtn.addEventListener("touchend", stopRecording);

    // Send audio blob to backend
    async function sendAudioToBackend() {
      const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
      const formData = new FormData();
      formData.append("file", audioBlob, "user_audio.webm");

      try {
        const response = await fetch(`${BACKEND_URL}/voice-agent`, {
          method: "POST",
          body: formData
        });

        if (!response.ok) throw new Error("Backend request failed");

        // Retrieve custom response headers
        const userTranscript = response.headers.get("X-User-Transcript") || "Audio submitted";
        const botReply = response.headers.get("X-Bot-Reply") || "Response received";

        // Display transcripts in UI
        appendLog("You", userTranscript, "user");
        appendLog("TestMu Assistant", botReply, "bot");

        // Play audio output
        const audioBytes = await response.blob();
        const audioUrl = URL.createObjectURL(audioBytes);
        const audio = new Audio(audioUrl);
        audio.play();

        statusText.innerText = "Press and hold button to speak...";
      } catch (err) {
        console.error("Error communicating with backend:", err);
        statusText.innerText = "Failed to process audio. Check backend connection.";
      }
    }

    function appendLog(sender, text, type) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${type}`;
      msgDiv.innerHTML = `
        <span class="sender">${sender}</span>
        <span class="text">${text}</span>
      `;
      logBox.appendChild(msgDiv);
      logBox.scrollTop = logBox.scrollHeight;
    }
  </script>
</body>
</html>
